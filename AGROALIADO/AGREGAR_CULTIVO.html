
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar cultivo - AGROALIADO</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f1f5ef;
            padding: 30px;
        }

        .contenedor {
            max-width: 750px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .encabezado {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            color: #285b38;
            margin-bottom: 8px;
        }

        .encabezado p {
            color: #777;
            font-size: 14px;
        }

        .formulario {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo.completo {
            grid-column: 1 / 3;
        }

        label {
            margin-bottom: 7px;
            color: #333;
            font-size: 14px;
            font-weight: bold;
        }

        input, select, textarea {
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #39784b;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .botones {
            grid-column: 1 / 3;
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }

        .guardar {
            background-color: #39784b;
            color: white;
        }

        .guardar:hover {
            background-color: #285b38;
        }

        .volver {
            background-color: #e5e9e3;
            color: #333;
        }

        .volver:hover {
            background-color: #d5dcd2;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .formulario {
                grid-template-columns: 1fr;
            }

            .campo.completo,
            .botones {
                grid-column: 1;
            }
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <div class="encabezado">
            <h1>🌱 Agregar cultivo</h1>
            <p>Registra la información de un nuevo cultivo</p>
        </div>

        <form class="formulario">

            <div class="campo">
                <label for="nombre">Nombre del cultivo</label>
                <input type="text" id="nombre"
                    placeholder="Ej. Tomate" required>
            </div>

            <div class="campo">
                <label for="variedad">Variedad</label>
                <input type="text" id="variedad"
                    placeholder="Ej. Tomate cherry">
            </div>

            <div class="campo">
                <label for="tipo">Tipo de cultivo</label>
                <select id="tipo" required>
                    <option value="">Seleccionar</option>
                    <option>Hortaliza</option>
                    <option>Frutal</option>
                    <option>Cereal</option>
                    <option>Leguminosa</option>
                    <option>Tubérculo</option>
                    <option>Otro</option>
                </select>
            </div>

            <div class="campo">
                <label for="fecha">Fecha de siembra</label>
                <input type="date" id="fecha" required>
            </div>

            <div class="campo">
                <label for="area">Área sembrada</label>
                <input type="number" id="area"
                    placeholder="Ej. 500" min="0.01" step="0.01" required>
            </div>

            <div class="campo">
                <label for="unidad">Unidad de medida</label>
                <select id="unidad" required>
                    <option value="">Seleccionar</option>
                    <option>Metros cuadrados</option>
                    <option>Hectáreas</option>
                </select>
            </div>

            <div class="campo completo">
                <label for="ubicacion">Ubicación del cultivo</label>
                <input type="text" id="ubicacion"
                    placeholder="Ej. Parcela 1, sector El Rosal">
            </div>

            <div class="campo completo">
                <label for="observaciones">Observaciones</label>
                <textarea id="observaciones"
                    placeholder="Escribe información adicional sobre el cultivo..."></textarea>
            </div>

            <div class="botones">
                <button type="button" class="volver"
                    onclick="window.location.href='PRINCIPAL.html'">
                    Volver
                </button>

                <button type="submit" class="guardar">
                    Guardar cultivo
                </button>
            </div>

        </form>

    </div>
        <!-- Código para guardar los cultivos -->
    <script>
        document.querySelector("form").addEventListener("submit", function(event) {

            event.preventDefault();

            const cultivo = {
                id: Date.now(),
                nombre: document.getElementById("nombre").value,
                variedad: document.getElementById("variedad").value,
                tipo: document.getElementById("tipo").value,
                fecha: document.getElementById("fecha").value,
                area: document.getElementById("area").value,
                unidad: document.getElementById("unidad").value,
                ubicacion: document.getElementById("ubicacion").value,
                observaciones: document.getElementById("observaciones").value
            };

            let cultivos = JSON.parse(localStorage.getItem("cultivos")) || [];

            cultivos.push(cultivo);

            localStorage.setItem("cultivos", JSON.stringify(cultivos));

            alert("¡Cultivo registrado correctamente!");

            window.location.href = "MIS_CULTIVOS.html";
        });
    </script>

</body>
</html>

</body>
</html>
