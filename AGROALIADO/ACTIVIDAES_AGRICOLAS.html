
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividades agrícolas - AGROALIADO</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f1f5ef;
            padding: 30px;
        }

        .contenedor {
            max-width: 750px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .encabezado {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            color: #285b38;
            margin-bottom: 8px;
        }

        .encabezado p {
            color: #777;
            font-size: 14px;
        }

        .formulario {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo.completo {
            grid-column: 1 / 3;
        }

        label {
            margin-bottom: 7px;
            color: #333;
            font-size: 14px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #39784b;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .botones {
            grid-column: 1 / 3;
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }

        .guardar {
            background-color: #39784b;
            color: white;
        }

        .guardar:hover {
            background-color: #285b38;
        }

        .volver {
            background-color: #e5e9e3;
            color: #333;
        }

        .volver:hover {
            background-color: #d5dcd2;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .formulario {
                grid-template-columns: 1fr;
            }

            .campo.completo,
            .botones {
                grid-column: 1;
            }
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <div class="encabezado">
            <h1>🌿 Actividades agrícolas</h1>
            <p>Registra las labores realizadas en tus cultivos</p>
        </div>

        <form class="formulario" id="formularioActividad">

            <div class="campo completo">
                <label for="cultivo">Nombre del cultivo</label>
                <input type="text" id="cultivo"
                    placeholder="Ej. Tomate" required>
            </div>

            <div class="campo">
                <label for="actividad">Tipo de actividad</label>
                <select id="actividad" required>
                    <option value="">Seleccionar actividad</option>
                    <option>Riego</option>
                    <option>Fertilización</option>
                    <option>Aplicación de abonos</option>
                    <option>Control de plagas</option>
                    <option>Poda</option>
                    <option>Mantenimiento</option>
                    <option>Preparación del terreno</option>
                    <option>Otra actividad</option>
                </select>
            </div>

            <div class="campo">
                <label for="fecha">Fecha de realización</label>
                <input type="date" id="fecha" required>
            </div>

            <div class="campo">
                <label for="producto">Producto utilizado</label>
                <input type="text" id="producto"
                    placeholder="Ej. Abono orgánico">
            </div>

            <div class="campo">
                <label for="cantidad">Cantidad utilizada</label>
                <input type="number" id="cantidad"
                    min="0" step="0.01" placeholder="Ej. 5">
            </div>

            <div class="campo">
                <label for="unidad">Unidad de medida</label>
                <select id="unidad">
                    <option value="">Seleccionar</option>
                    <option>Kilogramos</option>
                    <option>Gramos</option>
                    <option>Litros</option>
                    <option>Mililitros</option>
                    <option>Unidades</option>
                </select>
            </div>

            <div class="campo">
                <label for="responsable">Responsable</label>
                <input type="text" id="responsable"
                    placeholder="Nombre de quien realizó la labor">
            </div>

            <div class="campo completo">
                <label for="observaciones">Observaciones</label>
                <textarea id="observaciones"
                    placeholder="Describe cómo se realizó la actividad y sus resultados..."></textarea>
            </div>

            <div class="botones">

                <button type="button" class="volver"
                    onclick="window.location.href='PRINCIPAL.html'">
                    Volver
                </button>

                <button type="submit" class="guardar">
                    Guardar actividad
                </button>

            </div>

        </form>

    </div>

    <script>

        document.getElementById("formularioActividad")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                alert("La información de la actividad fue validada correctamente. Próximamente podrás guardarla en la base de datos.");

            });

    </script>

</body>
</html>
